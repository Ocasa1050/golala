name: Build Golala Android APK

on:
  push:
    branches: [jini]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Check paths, build JNI, and repackage APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Linux case-sensitive paths
        run: python3 .github/scripts/check_case_sensitive_paths.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r17c

      - name: Install legacy NDK runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libtinfo5

      - name: Build JNI shared library
        run: |
          "${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            NDK_OUT="${{ runner.temp }}/golala-obj" \
            NDK_LIBS_OUT="${{ github.workspace }}/build/libs"

      - name: Verify JNI output
        run: test -s build/libs/armeabi-v7a/libsampvoice.so

      - name: Replace native library in uploaded APK
        run: |
          python3 .github/scripts/replace_apk_native_library.py \
            --apk base.apk \
            --library build/libs/armeabi-v7a/libsampvoice.so \
            --output build/golala-unsigned.apk

      - name: Align and sign APK
        env:
          GOLALA_KEYSTORE_BASE64: ${{ secrets.GOLALA_KEYSTORE_BASE64 }}
          GOLALA_KEYSTORE_PASSWORD: ${{ secrets.GOLALA_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$GOLALA_KEYSTORE_BASE64" || { echo "Missing GOLALA_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$GOLALA_KEYSTORE_PASSWORD" || { echo "Missing GOLALA_KEYSTORE_PASSWORD secret"; exit 1; }
          printf '%s' "$GOLALA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/golala-release.jks"
          zipalign="$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"
          apksigner="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$zipalign" -f -p 4 build/golala-unsigned.apk build/golala-aligned-unsigned.apk
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/golala-release.jks" \
            --ks-key-alias golala-release \
            --ks-pass env:GOLALA_KEYSTORE_PASSWORD \
            --key-pass env:GOLALA_KEYSTORE_PASSWORD \
            --out build/golala-rebuilt.apk \
            build/golala-aligned-unsigned.apk
          "$apksigner" verify --verbose build/golala-rebuilt.apk
          "$zipalign" -c -v 4 build/golala-rebuilt.apk
          rm -f "$RUNNER_TEMP/golala-release.jks"

      - name: Verify APK package identity
        run: |
          aapt="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"
          original_package=$("$aapt" dump badging base.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          rebuilt_package=$("$aapt" dump badging build/golala-rebuilt.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          test -n "$original_package"
          test "$original_package" = "$rebuilt_package"
          echo "APK package preserved: $rebuilt_package"

      - name: Upload rebuilt APK and native library
        uses: actions/upload-artifact@v4
        with:
          name: golala-rebuilt-apk
          path: |
            build/golala-rebuilt.apk
            build/libs/armeabi-v7a/libsampvoice.so
          if-no-files-found: error
