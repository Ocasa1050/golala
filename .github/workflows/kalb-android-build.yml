name: Build Kalb Android APK

on:
  push:
    branches: [kalb]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build native library and repackage APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build tools
        run: sdkmanager "build-tools;35.0.0"

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r17c

      - name: Install legacy NDK runtime dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libtinfo5

      - name: Build armeabi-v7a native library
        run: |
          set -euo pipefail
          "${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build" \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=jni/Android.mk \
            NDK_APPLICATION_MK=jni/Application.mk \
            NDK_OUT="${{ runner.temp }}/kalb-obj" \
            NDK_LIBS_OUT="${{ github.workspace }}/build/libs"
          test -s build/libs/armeabi-v7a/libsampvoice.so
          readelf -h build/libs/armeabi-v7a/libsampvoice.so | grep -q 'Machine:.*ARM'

      - name: Replace native library in a copy of the APK
        run: |
          python3 .github/scripts/replace_native_library.py \
            --apk "base (3).apk" \
            --library build/libs/armeabi-v7a/libsampvoice.so \
            --output build/kalb-unsigned.apk

      - name: Align and sign APK
        env:
          KALB_KEYSTORE_BASE64: ${{ secrets.KALB_KEYSTORE_BASE64 }}
          KALB_KEYSTORE_PASSWORD: ${{ secrets.KALB_KEYSTORE_PASSWORD }}
          KALB_KEY_ALIAS: ${{ secrets.KALB_KEY_ALIAS }}
          KALB_KEY_PASSWORD: ${{ secrets.KALB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KALB_KEYSTORE_BASE64" || { echo "Missing KALB_KEYSTORE_BASE64 GitHub secret"; exit 1; }
          test -n "$KALB_KEYSTORE_PASSWORD" || { echo "Missing KALB_KEYSTORE_PASSWORD GitHub secret"; exit 1; }
          test -n "$KALB_KEY_ALIAS" || { echo "Missing KALB_KEY_ALIAS GitHub secret"; exit 1; }
          test -n "$KALB_KEY_PASSWORD" || { echo "Missing KALB_KEY_PASSWORD GitHub secret"; exit 1; }

          printf '%s' "$KALB_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kalb-release.jks"
          zipalign="$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign"
          apksigner="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          aapt="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt"

          "$zipalign" -f -p 4 build/kalb-unsigned.apk build/kalb-aligned-unsigned.apk
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/kalb-release.jks" \
            --ks-key-alias "$KALB_KEY_ALIAS" \
            --ks-pass env:KALB_KEYSTORE_PASSWORD \
            --key-pass env:KALB_KEY_PASSWORD \
            --out build/kalb-rebuilt.apk \
            build/kalb-aligned-unsigned.apk

          "$apksigner" verify --verbose build/kalb-rebuilt.apk
          "$zipalign" -c -v 4 build/kalb-rebuilt.apk
          original_package=$("$aapt" dump badging "base (3).apk" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          rebuilt_package=$("$aapt" dump badging build/kalb-rebuilt.apk | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
          test -n "$original_package"
          test "$original_package" = "$rebuilt_package"
          echo "APK package preserved: $rebuilt_package"
          rm -f "$RUNNER_TEMP/kalb-release.jks"

      - name: Upload APK and native library
        uses: actions/upload-artifact@v4
        with:
          name: kalb-rebuilt-apk
          path: |
            build/kalb-rebuilt.apk
            build/libs/armeabi-v7a/libsampvoice.so
          if-no-files-found: error
