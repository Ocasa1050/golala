name: Android build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17 for Android SDK tools
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 30
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platforms;android-30" "build-tools;30.0.3"

      - name: Set up Java 11 for the Android Gradle plugin
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.5.1"

      - name: Check case-sensitive project paths
        run: |
          test -f java/settings.gradle
          test -f java/app/build.gradle
          test -f java/app/src/main/AndroidManifest.xml
          test -f java/app/src/main/jniLibs/armeabi-v7a/libGTASA.so
          test -f source/jni/main.cpp

      - name: Configure Android SDK path
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > java/local.properties

      # ------------------------------------------------------------------
      # NEW: compile libsamp.so from source/jni (needs old NDK: gnustl_static)
      # ------------------------------------------------------------------
      - name: Install NDK r17c
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ndk.zip" https://dl.google.com/android/repository/android-ndk-r17c-linux-x86_64.zip
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "NDK_R17=$RUNNER_TEMP/android-ndk-r17c" >> "$GITHUB_ENV"

      - name: Fix libtinfo.so.5 for old NDK clang
        run: |
          # NDK r17c clang needs libtinfo.so.5 which Ubuntu 22.04 no longer ships.
          # Point it at the installed libtinfo.so.6 (CI machine only).
          LIBDIR=/lib/x86_64-linux-gnu
          if [ ! -e "$LIBDIR/libtinfo.so.5" ]; then
            sudo ln -s "$LIBDIR/libtinfo.so.6" "$LIBDIR/libtinfo.so.5"
          fi
          if [ ! -e "$LIBDIR/libncurses.so.5" ] && [ -e "$LIBDIR/libncurses.so.6" ]; then
            sudo ln -s "$LIBDIR/libncurses.so.6" "$LIBDIR/libncurses.so.5"
          fi
          "$NDK_R17/toolchains/llvm/prebuilt/linux-x86_64/bin/clang++" --version

      - name: Fix paths and filename case for the build (CI only)
        shell: bash
        run: |
          # Android.mk and the #include lines expect the encryption sources in
          # source/santrope-tea-gtasa, but the folder lives at the repo root.
          # Link it on this CI machine only. Nothing in the repository is moved.
          if [ -d santrope-tea-gtasa ] && [ ! -e source/santrope-tea-gtasa ]; then
            ln -s ../santrope-tea-gtasa source/santrope-tea-gtasa
          fi
          # Linux is case-sensitive: #include "..//chatWindow.h" cannot find
          # chatwindow.h. Create CI-only symlinks for every include whose file or
          # folder name differs only by upper/lower case.
          python3 - <<'PY'
          import os, re

          ROOT = "source/jni"
          EXTS = (".c", ".cc", ".cpp", ".h", ".hpp", ".inc")
          INC_RE = re.compile(r'^\s*#\s*include\s+"([^"]+)"', re.M)
          created = []
          unresolved = set()


          def ci_find(d, name):
              try:
                  for e in os.listdir(d):
                      if e.lower() == name.lower():
                          return e
              except OSError:
                  pass
              return None


          def resolve(base, rel):
              cur = base
              parts = [p for p in rel.replace("\\", "/").split("/") if p not in ("", ".")]
              for p in parts:
                  if p == "..":
                      cur = os.path.dirname(cur)
                      continue
                  cand = os.path.join(cur, p)
                  if os.path.lexists(cand):
                      cur = cand
                      continue
                  actual = ci_find(cur, p)
                  if actual is None:
                      return False
                  os.symlink(actual, cand)
                  created.append("%s -> %s" % (cand, actual))
                  cur = cand
              return True


          for dp, dn, fn in list(os.walk(ROOT)):
              for f in fn:
                  if not f.endswith(EXTS):
                      continue
                  path = os.path.join(dp, f)
                  if os.path.islink(path):
                      continue
                  text = open(path, encoding="utf-8", errors="ignore").read()
                  for inc in INC_RE.findall(text):
                      if os.path.exists(os.path.join(dp, inc)) or os.path.exists(os.path.join(ROOT, inc)):
                          continue
                      if resolve(dp, inc) and os.path.exists(os.path.join(dp, inc)):
                          continue
                      if resolve(ROOT, inc) and os.path.exists(os.path.join(ROOT, inc)):
                          continue
                      unresolved.add("%s: %s" % (path, inc))

          print("Created %d case-fix symlinks (CI only):" % len(created))
          for c in created:
              print("  " + c)
          if unresolved:
              print("Includes still not found: %d" % len(unresolved))
              for u in sorted(unresolved):
                  print("  " + u)
          PY

      - name: Build libsamp.so from source (NDK r17c)
        id: ndk
        continue-on-error: true
        shell: bash
        run: |
          # Android.mk uses vendor/RakNet but the folder is vendor/raknet.
          # Linux is case-sensitive, so make an alias that exists ONLY on this
          # CI machine. Nothing in the repository is renamed.
          if [ ! -e source/jni/vendor/RakNet ] && [ -d source/jni/vendor/raknet ]; then
            ln -s raknet source/jni/vendor/RakNet
          fi
          "$NDK_R17/ndk-build" -C source -j"$(nproc)" 2>&1 | tee ndk-build.log
          test -f source/libs/armeabi-v7a/libsamp.so

      - name: Use freshly built libsamp.so
        if: steps.ndk.outcome == 'success'
        run: cp source/libs/armeabi-v7a/libsamp.so java/app/src/main/jniLibs/armeabi-v7a/libsamp.so

      - name: Warn if libsamp.so build failed
        if: steps.ndk.outcome == 'failure'
        run: echo "::warning::libsamp.so build FAILED - this APK still uses the OLD prebuilt libsamp.so. Download the ndk-build-log artifact."

      - name: Upload ndk-build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ndk-build-log
          path: ndk-build.log
          if-no-files-found: ignore

      # ------------------------------------------------------------------

      - name: Build debug APK
        run: gradle --no-daemon -p java :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: golala-debug-apk
          path: java/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
